name: Build and Push n8n Enterprise Docker Image

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if this version + bypass combination was already pushed'
        type: boolean
        default: false
      n8n_tag:
        description: 'n8n release tag to build (e.g. n8n@2.40.5). Leave empty for the latest stable release.'
        type: string
        default: ''
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight UTC

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # تخصیص خودکار نام کاربری گیت‌هاب شما برای جلوگیری از ارور دسترسی
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: enterprise
  LOCAL_IMAGE: n8nio/n8n:build

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      n8n_tag: ${{ steps.get_version.outputs.n8n_tag }}
      n8n_version: ${{ steps.get_version.outputs.n8n_version }}
      build_key: ${{ steps.get_version.outputs.build_key }}

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Resolve n8n version to build
      id: get_version
      env:
        TAG_OVERRIDE: ${{ inputs.n8n_tag }}
      run: |
        set -euo pipefail

        if [ -n "$TAG_OVERRIDE" ]; then
          latest_stable_tag="$TAG_OVERRIDE"
        else
          # دریافت قطعی جدیدترین نسخه مستقیماً از رجیستری npm
          latest_version=$(npm show n8n version)
          latest_stable_tag="n8n@${latest_version}"
        fi

        version_number="${latest_stable_tag#n8n@}"

        if ! printf '%s' "$version_number" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error title=Version resolution failed::Expected an immutable n8n@X.Y.Z release tag, got '${latest_stable_tag:-<empty>}'"
          exit 1
        fi

        bypass_hash=$(sha256sum bypass.sh | cut -c1-12)
        build_key="${version_number}-b${bypass_hash}"

        {
          echo "n8n_tag=$latest_stable_tag"
          echo "n8n_version=$version_number"
          echo "build_key=$build_key"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if this version and bypass combination was already built
      id: version_check
      env:
        BUILD_KEY: ${{ steps.get_version.outputs.build_key }}
        FORCE_BUILD: ${{ inputs.force_build }}
      run: |
        set -euo pipefail

        if [ "$FORCE_BUILD" = "true" ]; then
          echo "should_build=true" >> "$GITHUB_OUTPUT"
        elif docker manifest inspect "$REGISTRY/$IMAGE_NAME:$BUILD_KEY" >/dev/null 2>&1; then
          echo "should_build=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_build=true" >> "$GITHUB_OUTPUT"
        fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Clone n8n repository
      env:
        N8N_TAG: ${{ needs.check-version.outputs.n8n_tag }}
      run: |
        set -euo pipefail
        git clone --depth 1 --branch "$N8N_TAG" https://github.com/n8n-io/n8n.git n8n-source
        n8n_commit_hash=$(git -C n8n-source rev-parse HEAD)
        echo "N8N_COMMIT_HASH=$n8n_commit_hash" >> "$GITHUB_ENV"

    - name: Copy bypass script to n8n repository
      run: |
        set -euo pipefail
        if [ ! -f bypass.sh ]; then
          echo "::error title=Missing bypass.sh::bypass.sh not found; refusing to publish an unpatched image"
          exit 1
        fi
        cp bypass.sh n8n-source/
        echo "bypass.sh copied to n8n-source"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # قفل شدن روی این نسخه برای جلوگیری از کرش کردن isolated-vm
        node-version: '20.18.3'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        # خواندن نسخه pnpm از سورس n8n برای جلوگیری از ارورهای pnpm v12
        package_json_file: n8n-source/package.json

    - name: Install dependencies
      working-directory: n8n-source
      run: pnpm install --frozen-lockfile

    - name: Run bypass script
      working-directory: n8n-source
      run: |
        set -euo pipefail
        sed -i 's/\r$//' bypass.sh
        chmod +x bypass.sh
        ./bypass.sh --auto

    - name: Build n8n
      working-directory: n8n-source
      run: pnpm run build

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      working-directory: n8n-source
      env:
        CONTAINER_ENGINE: docker
        IMAGE_BASE_NAME: n8nio/n8n
        IMAGE_TAG: build
      run: pnpm run build:docker

    - name: Tag and push Docker image
      env:
        N8N_VERSION: ${{ needs.check-version.outputs.n8n_version }}
        BUILD_KEY: ${{ needs.check-version.outputs.build_key }}
      run: |
        set -euo pipefail

        if ! docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
          echo "::error title=Image not found::build:docker did not produce $LOCAL_IMAGE"
          exit 1
        fi

        tags=(
          "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          "$REGISTRY/$IMAGE_NAME:latest"
          "$REGISTRY/$IMAGE_NAME:$N8N_VERSION"
          "$REGISTRY/$IMAGE_NAME:$BUILD_KEY"
          "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          "$REGISTRY/$IMAGE_NAME:n8n-$N8N_COMMIT_HASH"
        )

        for tag in "${tags[@]}"; do
          docker tag "$LOCAL_IMAGE" "$tag"
          docker push "$tag"
        done

    - name: Clean up
      if: always()
      run: docker system prune -f
